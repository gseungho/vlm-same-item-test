[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtrust"
version = "0.1.0"
requires-python = ">=3.10"
# Pin exact versions of anything that can change what is sent to the API.
dependencies = ["anthropic==0.84.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Only for reading the photos when the sample is fixed; nothing here touches the API.
sample = ["pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
